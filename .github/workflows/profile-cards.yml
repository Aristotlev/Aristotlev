name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  push:
    paths:
      - ".github/workflows/profile-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      # Optional repo secret GH_STATS_TOKEN (classic PAT: repo + read:user) counts private repos/contributions.
      TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
      COLORS: bg_color=0d1117&title_color=00D47E&icon_color=3B82F6&text_color=c9d1d9&hide_border=true&border_radius=10
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&include_all_commits=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR&${{ env.COLORS }}
          path: profile/stats.svg
          token: ${{ env.TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&${{ env.COLORS }}
          path: profile/top-langs.svg
          token: ${{ env.TOKEN }}

      - name: Streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&border_radius=10&background=0D1117&stroke=30363D&ring=00D47E&fire=00D47E&currStreakNum=00D47E&currStreakLabel=00D47E&sideNums=3B82F6&sideLabels=3B82F6&dates=8B949E&disable_animations=true
          path: profile/streak.svg
          token: ${{ env.TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
